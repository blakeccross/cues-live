name: Release macOS

# Builds a Developer ID–signed, notarized cues.live.app, packages a drag-to-
# Applications DMG for first install, zips the app for Sparkle updates,
# generates appcast.xml, and uploads everything to a GitHub Release.
#
# Trigger:
#   - Push a tag: v1.2.3
#   - Or run manually (Actions → Release macOS → Run workflow)
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   BUILD_CERTIFICATE_BASE64  Developer ID Application cert exported as .p12, base64-encoded
#   P12_PASSWORD              Password for that .p12
#   KEYCHAIN_PASSWORD         Any random password for the temporary CI keychain
#   APPLE_TEAM_ID             Your 10-char Team ID (e.g. 6U2Y6W57T7)
#   APPLE_API_KEY_BASE64      App Store Connect API .p8 key, base64-encoded
#   APPLE_API_KEY_ID          Key ID from App Store Connect
#   APPLE_API_ISSUER_ID       Issuer ID from App Store Connect
#   SPARKLE_PRIVATE_KEY       Sparkle EdDSA private key (output of: generate_keys -x sparkle_private.key)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version (e.g. 1.2.3). Leave empty to use the tag or 0.0.0-dev."
        required: false
        type: string
      build_number:
        description: "Build number / CFBundleVersion (integer, must increase each release)."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # macos-15's Xcode.app is still 16.4, which cannot compile AppIcon.icon.
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun --show-sdk-version --sdk macosx
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode/{split($2,a,"."); print a[1]}')"
          if [[ "${XCODE_MAJOR}" -lt 26 ]]; then
            echo "Xcode 26+ is required to compile AppIcon.icon (got $(xcodebuild -version | head -n 1))"
            exit 1
          fi

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project CuesLive.xcodeproj -scheme CuesLive

      - name: Verify rubberband submodule
        run: |
          test -f ThirdParty/rubberband/single/RubberBandSingle.cpp
          test -f ThirdParty/rubberband/rubberband/rubberband-c.h
          echo "rubberband submodule OK"

      - name: Resolve versions
        id: versions
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MARKETING="${{ inputs.marketing_version }}"
            BUILD="${{ inputs.build_number }}"
          else
            # tag like v1.2.3 → 1.2.3
            MARKETING="${GITHUB_REF_NAME#v}"
            BUILD="${{ github.run_number }}"
          fi

          if [[ -z "${MARKETING}" ]]; then
            MARKETING="0.0.0-ci"
          fi

          if [[ ! "${BUILD}" =~ ^[0-9]+$ ]]; then
            echo "Build number must be an integer, got: ${BUILD}"
            exit 1
          fi

          echo "marketing=${MARKETING}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "tag=v${MARKETING}" >> "$GITHUB_OUTPUT"
          echo "Using MARKETING_VERSION=${MARKETING} CURRENT_PROJECT_VERSION=${BUILD}"

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Archive and export Developer ID app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          MARKETING="${{ steps.versions.outputs.marketing }}"
          BUILD="${{ steps.versions.outputs.build }}"

          mkdir -p build

          set -o pipefail

          # Build each Mac arch separately (Release whole-module + both arches in one
          # xcodebuild often OOMs on GH runners), then lipo into a universal app.
          COMMON_ARGS=(
            -project CuesLive.xcodeproj
            -scheme CuesLive
            -configuration Release
            -destination "generic/platform=macOS"
            MARKETING_VERSION="$MARKETING"
            CURRENT_PROJECT_VERSION="$BUILD"
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
            CODE_SIGN_STYLE=Manual
            CODE_SIGN_IDENTITY="Developer ID Application"
            OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime"
            ENABLE_PREVIEWS=NO
            ONLY_ACTIVE_ARCH=NO
            COMPILER_INDEX_STORE_ENABLE=NO
          )

          echo "===== Archiving arm64 ====="
          xcodebuild "${COMMON_ARGS[@]}" \
            -archivePath "$PWD/build/CuesLive-arm64.xcarchive" \
            -resultBundlePath "$PWD/build/Archive-arm64.xcresult" \
            ARCHS=arm64 \
            EXCLUDED_ARCHS=x86_64 \
            clean archive 2>&1 | tee build/archive-arm64.log

          echo "===== Archiving x86_64 ====="
          xcodebuild "${COMMON_ARGS[@]}" \
            -archivePath "$PWD/build/CuesLive-x86_64.xcarchive" \
            -resultBundlePath "$PWD/build/Archive-x86_64.xcresult" \
            ARCHS=x86_64 \
            EXCLUDED_ARCHS=arm64 \
            archive 2>&1 | tee build/archive-x86_64.log

          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" ExportOptions-DeveloperID.plist

          echo "===== Exporting arm64 ====="
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/CuesLive-arm64.xcarchive" \
            -exportPath "$PWD/build/export-arm64" \
            -exportOptionsPlist ExportOptions-DeveloperID.plist

          echo "===== Exporting x86_64 ====="
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/CuesLive-x86_64.xcarchive" \
            -exportPath "$PWD/build/export-x86_64" \
            -exportOptionsPlist ExportOptions-DeveloperID.plist

          ARM_APP="build/export-arm64/cues.live.app"
          X86_APP="build/export-x86_64/cues.live.app"
          APP="build/export/cues.live.app"
          test -d "$ARM_APP"
          test -d "$X86_APP"

          rm -rf build/export
          mkdir -p build/export
          ditto "$ARM_APP" "$APP"

          # Merge thin Mach-O binaries (app executable + any thin framework dylibs).
          while IFS= read -r -d '' REL; do
            REL="${REL#./}"
            ARM_BIN="${ARM_APP}/${REL}"
            X86_BIN="${X86_APP}/${REL}"
            OUT_BIN="${APP}/${REL}"
            if [[ ! -f "$X86_BIN" ]]; then
              echo "Missing x86_64 counterpart for ${REL}; keeping arm64 slice"
              continue
            fi
            if file "$ARM_BIN" | grep -q 'Mach-O'; then
              if lipo -info "$ARM_BIN" 2>/dev/null | grep -q 'Non-fat file'; then
                echo "lipo ${REL}"
                lipo -create "$ARM_BIN" "$X86_BIN" -output "$OUT_BIN"
              else
                echo "already fat: ${REL} ($(lipo -info "$ARM_BIN"))"
              fi
            fi
          done < <(cd "$ARM_APP" && find . -type f \( -perm -111 -o -name '*.dylib' -o -name '*.so' \) -print0)

          BINARY="$APP/Contents/MacOS/cues.live"
          lipo -info "$BINARY"
          lipo -info "$BINARY" | grep -q 'x86_64'
          lipo -info "$BINARY" | grep -q 'arm64'

          # Re-sign after lipo (nested first, then the bundle).
          IDENTITY="$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          test -n "$IDENTITY"
          if [[ -d "$APP/Contents/Frameworks" ]]; then
            find "$APP/Contents/Frameworks" -type f \( -perm -111 -o -name '*.dylib' \) -print0 \
              | while IFS= read -r -d '' NESTED; do
                  codesign --force --options runtime --timestamp --sign "$IDENTITY" "$NESTED"
                done
            find "$APP/Contents/Frameworks" -name '*.framework' -maxdepth 1 -print0 \
              | while IFS= read -r -d '' FW; do
                  codesign --force --options runtime --timestamp --sign "$IDENTITY" "$FW"
                done
          fi
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$BINARY"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          ICON="$APP/Contents/Resources/AppIcon.icns"
          test -s "$ICON"
          echo "AppIcon.icns $(wc -c < "$ICON" | tr -d ' ') bytes"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist"

      - name: Show compile errors on failure
        if: failure()
        run: |
          for log in build/archive-arm64.log build/archive-x86_64.log build/archive.log; do
            if [[ -f "$log" ]]; then
              echo "===== Likely compiler diagnostics ($log) ====="
              grep -E "error:|fatal error:|❌|LLVM ERROR|out of memory|unable to|cannot find|No such file|Command.*failed" "$log" | tail -n 200 || true
              echo "===== Last 80 log lines ($log) ====="
              tail -n 80 "$log" || true
            fi
          done

      - name: Upload archive diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-diagnostics
          path: |
            build/archive-arm64.log
            build/archive-x86_64.log
            build/archive.log
            build/Archive-arm64.xcresult
            build/Archive-x86_64.xcresult
            build/Archive.xcresult
          if-no-files-found: ignore

      - name: Notarize and staple
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          APP="build/export/cues.live.app"
          SUBMIT_ZIP="build/cues.live-notarize.zip"
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"

          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode -o "$KEY_PATH"

          # Zip for notarization (ditto preserves macOS metadata)
          ditto -c -k --keepParent "$APP" "$SUBMIT_ZIP"

          xcrun notarytool submit "$SUBMIT_ZIP" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build drag-to-Applications DMG
        run: |
          set -euo pipefail
          MARKETING="${{ steps.versions.outputs.marketing }}"
          BUILD="${{ steps.versions.outputs.build }}"
          APP="build/export/cues.live.app"
          INSTALL="build/install"
          mkdir -p "$INSTALL"

          DMG_NAME="cues.live-${MARKETING}-${BUILD}.dmg"
          DMG_PATH="$INSTALL/$DMG_NAME"

          Scripts/create-install-dmg.sh "$APP" "$DMG_PATH" "cues.live ${MARKETING}"

          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Notarize and staple DMG
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode -o "$KEY_PATH"

          xcrun notarytool submit "$DMG_PATH" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Package Sparkle zip + appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          MARKETING="${{ steps.versions.outputs.marketing }}"
          BUILD="${{ steps.versions.outputs.build }}"
          APP="build/export/cues.live.app"
          DIST="build/dist"
          mkdir -p "$DIST"

          ZIP_NAME="cues.live-${MARKETING}-${BUILD}.zip"
          ZIP_PATH="$DIST/$ZIP_NAME"

          ditto -c -k --keepParent "$APP" "$ZIP_PATH"

          # Carry forward the previous appcast so the feed stays cumulative.
          # SUFeedURL points at releases/latest/download/appcast.xml
          if gh api "repos/${{ github.repository }}/releases/latest" --jq '.assets[].name' 2>/dev/null | grep -qx 'appcast.xml'; then
            echo "Downloading previous appcast.xml from latest release"
            gh release download --repo "${{ github.repository }}" --pattern 'appcast.xml' --dir "$DIST" || true
          else
            echo "No previous appcast.xml found; starting a new feed"
          fi

          SPARKLE_VERSION="$(
            python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("CuesLive.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved").read_text())
          for pin in data.get("pins", []):
              if pin.get("identity") == "sparkle":
                  print(pin["state"]["version"])
                  break
          else:
              raise SystemExit("Sparkle pin not found in Package.resolved")
          PY
          )"

          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"

          GENERATE_APPCAST="$RUNNER_TEMP/bin/generate_appcast"
          test -x "$GENERATE_APPCAST"

          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed_key"
          chmod 600 "$RUNNER_TEMP/sparkle_ed_key"

          # Appcast only indexes archives in $DIST (zip). The install DMG lives
          # under build/install/ so generate_appcast does not publish it as an update.
          "$GENERATE_APPCAST" \
            --ed-key-file "$RUNNER_TEMP/sparkle_ed_key" \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/v${MARKETING}/" \
            --link "https://github.com/${{ github.repository }}" \
            "$DIST"

          test -f "$DIST/appcast.xml"
          grep -q "$ZIP_NAME" "$DIST/appcast.xml"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "APPCAST_PATH=$DIST/appcast.xml" >> "$GITHUB_ENV"

          echo "Packaged:"
          ls -lh "$DIST"
          echo "CFBundleShortVersionString=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          echo "CFBundleVersion=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")"


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versions.outputs.tag }}
          name: cues.live ${{ steps.versions.outputs.marketing }} (${{ steps.versions.outputs.build }})
          generate_release_notes: true
          files: |
            ${{ env.DMG_PATH }}
            ${{ env.ZIP_PATH }}
            ${{ env.APPCAST_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
